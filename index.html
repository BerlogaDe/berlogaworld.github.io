<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=JetBrains+Mono:wght@400&family=Unbounded:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070c;
      --text: #e8e8f0;
      --muted: #7a7a90;
      --accent-1: #7c3aed;
      --accent-2: #06b6d4;
      --accent-3: #ec4899;
      --error: #f87171;
      --focus-ring: rgba(6, 182, 212, 0.2);
      transition: --accent-1 .6s ease, --accent-2 .6s ease, --accent-3 .6s ease, --focus-ring .6s ease;
    }

    /* Регистрируем цвета, чтобы они плавно анимировались */
    @property --accent-1 { syntax: '<color>'; inherits: true; initial-value: #7c3aed; }
    @property --accent-2 { syntax: '<color>'; inherits: true; initial-value: #06b6d4; }
    @property --accent-3 { syntax: '<color>'; inherits: true; initial-value: #ec4899; }
    @property --focus-ring { syntax: '<color>'; inherits: true; initial-value: rgba(6, 182, 212, 0.2); }

    /* Неверный пароль: вся гамма уходит в красный */
    :root.denied {
      --accent-1: #b91c1c;
      --accent-2: #ef4444;
      --accent-3: #f97316;
      --focus-ring: rgba(239, 68, 68, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: float 18s ease-in-out infinite;
      pointer-events: none;
    }
    .blob.b1 { width: 420px; height: 420px; background: var(--accent-1); top: -120px; left: -100px; }
    .blob.b2 { width: 360px; height: 360px; background: var(--accent-2); bottom: -120px; right: -80px; animation-delay: -6s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(60px, 40px) scale(1.1); }
      66% { transform: translate(-40px, 60px) scale(0.95); }
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }

    form {
      position: relative;
      z-index: 10;
      width: min(380px, calc(100% - 32px));
      padding: 40px 32px;
      border-radius: 24px;
      background: rgba(14, 14, 22, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08) inset,
        0 40px 100px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: appear 0.9s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }
    form.shake { animation: shake 0.4s; }
    @keyframes shake {
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .lock {
      width: 52px; height: 52px;
      margin: 0 auto 20px;
      border-radius: 16px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    }

    h1 { font-weight: 600; font-size: 1.4rem; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font: inherit;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    button {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      transition: opacity .2s, transform .1s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: wait; }

    .remember {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .remember input { width: auto; accent-color: var(--accent-2); }

    .error { color: var(--error); font-size: 0.85rem; min-height: 1.2em; margin-top: 12px; }

    /* Маленький шар, который плывёт за курсором */
    #orb {
      position: fixed;
      top: 0; left: 0;
      width: 180px; height: 180px;
      margin: -90px 0 0 -90px;
      background: var(--accent-1);
      filter: blur(60px);
      opacity: 0;
      animation: none;
      transition: opacity .6s;
      will-change: transform;
      z-index: 0;
    }
    #orb.on { opacity: 0.55; }

    /* ===== Cyberpunk-переход ===== */
    form.glitch-out { animation: glitch-out .65s steps(7) forwards; }
    @keyframes glitch-out {
      0%   { transform: none; filter: none; opacity: 1; }
      15%  { transform: translate(-6px, 2px) skewX(8deg); filter: hue-rotate(90deg); clip-path: inset(10% 0 40% 0); }
      30%  { transform: translate(8px, -3px); filter: hue-rotate(-90deg) saturate(3); clip-path: inset(50% 0 5% 0); }
      45%  { transform: translate(-3px, 0) skewX(-12deg); clip-path: inset(0 0 70% 0); }
      60%  { transform: translate(10px, 1px); filter: invert(1); clip-path: inset(30% 0 30% 0); }
      80%  { transform: scaleY(0.05); opacity: .8; clip-path: none; filter: none; }
      100% { transform: scaleY(0) scaleX(1.4); opacity: 0; }
    }

    #cyber {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 16px;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, #10101c 0%, #05050a 70%);
      animation: cy-flicker .45s steps(3);
    }
    @keyframes cy-flicker {
      0% { opacity: 0; } 33% { opacity: .7; } 66% { opacity: .2; } 100% { opacity: 1; }
    }

    .cy-log {
      width: min(460px, 100%);
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.7rem, 2.6vw, 0.85rem);
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
      line-height: 1.8;
      white-space: pre;
    }

    .cy-title {
      position: relative;
      font-family: 'Unbounded', 'Inter', sans-serif;
      font-weight: 800;
      font-size: clamp(1.4rem, 6vw, 3rem);
      letter-spacing: 0.04em;
      color: #fcee0a;
      text-shadow: 3px 0 #ff2a6d, -3px 0 #00f0ff, 0 0 24px rgba(252, 238, 10, 0.45);
      min-height: 1.2em;
      text-align: center;
    }
    #cyber.granted .cy-title { animation: cy-jitter 1.2s steps(2) infinite; }
    @keyframes cy-jitter {
      0%, 90%, 100% { transform: none; }
      92% { transform: translate(-3px, 1px) skewX(-6deg); text-shadow: -4px 0 #ff2a6d, 4px 0 #00f0ff; }
      95% { transform: translate(3px, -1px); }
    }

    .cy-bar {
      width: min(460px, 100%);
      height: 4px;
      background: rgba(252, 238, 10, 0.12);
      clip-path: polygon(0 0, 100% 0, 98% 100%, 0 100%);
    }
    .cy-bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #fcee0a;
      box-shadow: 0 0 12px #fcee0a;
    }
    #cyber .cy-bar i { animation: cy-load 2.6s cubic-bezier(.7, 0, .3, 1) forwards; }
    @keyframes cy-load { to { width: 100%; } }

    /* Автовход по сохранённому ключу: форму не показываем */
    html.auto-login form { visibility: hidden; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      #orb { display: none; }
    }
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="grid"></div>
  <div class="blob" id="orb"></div>

  <form id="login" autocomplete="off">
    <div class="lock">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>Закрытый сайт</h1>
    <p class="sub">Введите пароль, чтобы войти</p>
    <input id="pw" type="password" placeholder="Пароль" autofocus required>
    <button id="btn" type="submit">Войти</button>
    <label class="remember"><input id="remember" type="checkbox"> Запомнить на этом устройстве</label>
    <p class="error" id="err"></p>
  </form>

  <script>
    // Шар, который плывёт за курсором и переливается цветами сайта
    (() => {
      const orb = document.getElementById('orb');
      const colors = [[124, 58, 237], [6, 182, 212], [236, 72, 153]];
      const target = { x: innerWidth / 2, y: innerHeight / 2 };
      const pos = { ...target };

      addEventListener('pointermove', (e) => {
        target.x = e.clientX;
        target.y = e.clientY;
        orb.classList.add('on');
      });
      document.addEventListener('pointerleave', () => orb.classList.remove('on'));

      function colorAt(t) {
        const f = (t % 1) * colors.length;
        const i = Math.floor(f), k = f - i;
        const a = colors[i], b = colors[(i + 1) % colors.length];
        return a.map((v, j) => Math.round(v + (b[j] - v) * k));
      }

      // При неверном пароле шар плавно краснеет и потом возвращает цвет
      const RED = [239, 68, 68];
      let red = 0;

      function frame(now) {
        pos.x += (target.x - pos.x) * 0.08;
        pos.y += (target.y - pos.y) * 0.08;
        orb.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
        const wantRed = document.documentElement.classList.contains('denied') ? 1 : 0;
        red += (wantRed - red) * 0.06;
        const c = colorAt(now / 9000).map((v, j) => Math.round(v + (RED[j] - v) * red));
        orb.style.background = `rgb(${c.join(', ')})`;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>

    const STORE_KEY = 'site-key-' + PAYLOAD.salt;

    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

    async function deriveKey(password) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        true,
        ['decrypt']
      );
    }

    async function decryptWith(key) {
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
      return new TextDecoder().decode(plain);
    }

    // ===== Переход в стиле cyberpunk =====
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const GLYPHS = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ0123456789#$%&*<>/\\|=+';

    // Печатает строку посимвольно
    async function typeText(el, text, ms) {
      const step = ms / text.length;
      for (let i = 1; i <= text.length; i++) {
        el.textContent = text.slice(0, i);
        await sleep(step);
      }
    }

    // Текст «расшифровывается» из случайных символов слева направо
    function scramble(el, text, ms) {
      return new Promise((resolve) => {
        const start = performance.now();
        function frame(now) {
          const p = Math.min(1, (now - start) / ms);
          const fixed = Math.floor(text.length * p);
          let out = text.slice(0, fixed);
          for (let i = fixed; i < text.length; i++) {
            out += text[i] === ' ' ? ' ' : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
          }
          el.textContent = out;
          el.dataset.text = out;
          if (p < 1) requestAnimationFrame(frame);
          else resolve();
        }
        requestAnimationFrame(frame);
      });
    }

    // Этап 1: панель глючит, появляется терминал и «ДОСТУП РАЗРЕШЁН»
    async function playAccess() {
      form.classList.add('glitch-out');
      await sleep(650);

      const ov = document.createElement('div');
      ov.id = 'cyber';
      ov.innerHTML = '<div class="cy-log"></div><h2 class="cy-title"></h2><div class="cy-bar"><i></i></div>';
      document.body.appendChild(ov);
      const log = ov.querySelector('.cy-log');

      const lines = [
        '> установка соединения ........ OK',
        '> проверка ключа AES-256 ...... OK',
        '> расшифровка данных .......... OK',
        '> загрузка интерфейса',
      ];
      for (const line of lines) {
        const p = document.createElement('p');
        log.appendChild(p);
        await typeText(p, line, 320);
      }

      ov.classList.add('granted');
      await scramble(ov.querySelector('.cy-title'), 'ДОСТУП РАЗРЕШЁН', 1100);
      await sleep(1000);
    }

    // Этап 2 (выполняется уже на странице с приветствием): экран рвётся на полосы
    function revealCyber() {
      const st = document.createElement('style');
      st.textContent = `
        .cy-strip {
          position: fixed; left: 0; width: 100%;
          z-index: 1000; pointer-events: none;
          background: #05050a repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px);
          animation: cy-tear .8s steps(8) forwards;
        }
        @keyframes cy-tear {
          0%   { transform: translateX(0); }
          35%  { transform: translateX(var(--j)); }
          100% { transform: translateX(var(--x)); opacity: 0; }
        }
        html.cy-in body { animation: cy-shift .85s steps(6); }
        @keyframes cy-shift {
          0%   { filter: hue-rotate(90deg) saturate(3); transform: translateX(-8px); }
          40%  { filter: hue-rotate(-60deg); transform: translateX(6px); }
          100% { filter: none; transform: none; }
        }`;
      document.head.appendChild(st);

      const N = 18, h = innerHeight / N;
      const neon = ['#00f0ff', '#ff2a6d', '#fcee0a'];
      const strips = [];
      for (let i = 0; i < N; i++) {
        const d = document.createElement('div');
        d.className = 'cy-strip';
        d.style.top = `${i * h}px`;
        d.style.height = `${h + 1}px`;
        d.style.borderTop = `1px solid ${neon[i % 3]}`;
        d.style.setProperty('--j', `${(Math.random() - 0.5) * 80}px`);
        d.style.setProperty('--x', `${Math.random() < 0.5 ? -110 : 110}vw`);
        d.style.animationDelay = `${Math.random() * 500}ms`;
        document.body.appendChild(d);
        strips.push(d);
      }
      document.documentElement.classList.add('cy-in');
      setTimeout(() => {
        strips.forEach((d) => d.remove());
        st.remove();
        document.documentElement.classList.remove('cy-in');
      }, 1500);
    }

    async function enterSite(html) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return show(html);
      await playAccess();
      show(html + `\n<script>(${revealCyber.toString()})();<\/script>`);
    }

    // Ключ передаём открытой странице — им расшифровываются скриншоты
    let siteKey = '';

    function show(html) {
      // Пока страница входа ещё грузится, document.write не заменяет её, а дописывает
      // сайт в конец — поэтому ждём окончания загрузки
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => show(html), { once: true });
        return;
      }
      document.open();
      const keyScript = siteKey ? `\n<script>window.__SITE_KEY = ${JSON.stringify(siteKey)};<\/script>` : '';
      document.write(html + keyScript);
      document.close();
    }

    function storage(kind) {
      try { return window[kind]; } catch { return null; }
    }

    // Если ключ уже сохранён — входим сразу, не показывая форму
    (async () => {
      if (!window.crypto || !crypto.subtle) return;
      for (const kind of ['sessionStorage', 'localStorage']) {
        const s = storage(kind);
        let saved = null;
        try { saved = s && s.getItem(STORE_KEY); } catch {}
        if (!saved) continue;
        document.documentElement.classList.add('auto-login');
        try {
          const key = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']);
          const html = await decryptWith(key);
          siteKey = saved;
          show(html);
          return;
        } catch {
          try { s.removeItem(STORE_KEY); } catch {}
        }
      }
      // Сохранённый ключ не подошёл — показываем обычную форму входа
      document.documentElement.classList.remove('auto-login');
    })();

    const form = document.getElementById('login');
    const pw = document.getElementById('pw');
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    let deniedTimer;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      if (!window.crypto || !crypto.subtle) {
        err.textContent = 'Браузер не поддерживает расшифровку: откройте сайт по https://';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Проверка…';
      try {
        const key = await deriveKey(pw.value);
        const html = await decryptWith(key);
        const raw = toB64(await crypto.subtle.exportKey('raw', key));
        siteKey = raw;
        const kind = document.getElementById('remember').checked ? 'localStorage' : 'sessionStorage';
        try { storage(kind).setItem(STORE_KEY, raw); } catch {}
        btn.textContent = 'Вход…';
        await enterSite(html);
      } catch {
        err.textContent = 'Неверный пароль';
        document.documentElement.classList.add('denied');
        clearTimeout(deniedTimer);
        deniedTimer = setTimeout(() => document.documentElement.classList.remove('denied'), 1600);
        form.classList.remove('shake');
        void form.offsetWidth;
        form.classList.add('shake');
        pw.select();
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    });
  </script>
</body>
</html>
